name: A11y HITL Verify

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo of the target open-source project'
        required: true
        type: string
      pr_or_branch:
        description: 'Branch name or PR ref (pull/<num>/head) to test'
        required: true
        type: string
      phase:
        description: 'Verification phase'
        required: true
        type: choice
        options:
          - reproduce
          - verify_fix
        default: reproduce
      platform:
        description: 'Target verification platform'
        required: false
        type: choice
        options:
          - desktop
          - android
          - nvda_source
        default: desktop
      relay_host:
        description: 'NVDA Remote relay host'
        required: false
        type: string
        default: nvdaremote.com
      session_key:
        description: 'Random connection key passed by the local dispatcher'
        required: false
        type: string
        default: ''
      setup_cmd:
        description: 'Dependency install/build command (run inside target-app/)'
        required: false
        type: string
        default: ''
      companion_setup_cmd:
        description: 'Optional PowerShell command to install/extract companion software'
        required: false
        type: string
        default: ''
      custom_hook_b64:
        description: 'Optional Base64-encoded per-issue hook script (.hitl-hook.ps1 or .hitl-hook.sh)'
        required: false
        type: string
        default: ''
      start_cmd:
        description: 'Command or URL to launch the target app/browser in the foreground'
        required: false
        type: string
        default: ''
      apk_glob:
        description: 'Glob pattern for Android debug APK'
        required: false
        type: string
        default: target-app/**/build/outputs/apk/debug/*.apk
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 20

concurrency:
  group: a11y-hitl-singleton
  cancel-in-progress: true

jobs:
  verify-desktop:
    if: ${{ inputs.platform == 'desktop' || inputs.platform == 'nvda_source' }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.pr_or_branch }}
          path: target-app
          submodules: recursive
          token: ''

      - name: Cache NVDA SCons build artifacts
        if: ${{ inputs.platform == 'nvda_source' }}
        uses: actions/cache@v4
        with:
          path: |
            target-app/build
            target-app/.sconsign.dblite
            target-app/source/include
          key: ${{ runner.os }}-nvda-scons-${{ hashFiles('target-app/sconstruct', 'target-app/nvdaHelper/**/*.cpp', 'target-app/nvdaHelper/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-nvda-scons-

      - name: Cache target dependencies
        if: ${{ inputs.platform == 'desktop' }}
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\npm-cache
            ~\AppData\Local\pip\Cache
            ~\.nuget\packages
          key: ${{ runner.os }}-${{ inputs.target_repo }}-${{ hashFiles('target-app/**/package-lock.json', 'target-app/**/pnpm-lock.yaml', 'target-app/**/yarn.lock', 'target-app/**/requirements.txt', 'target-app/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.target_repo }}-

      - name: Setup NVDA Remote and launch target
        shell: pwsh
        run: |
          .\scripts\setup_nvda_remote.ps1 `
            -Platform "${{ inputs.platform }}" `
            -RelayHost "${{ inputs.relay_host }}" `
            -SessionKey "${{ inputs.session_key }}" `
            -SetupCmd "${{ inputs.setup_cmd }}" `
            -CompanionSetupCmd "${{ inputs.companion_setup_cmd }}" `
            -CustomHookB64 "${{ inputs.custom_hook_b64 }}" `
            -StartCmd "${{ inputs.start_cmd }}"

      - name: Collect HITL artifacts
        if: always()
        shell: pwsh
        run: |
          $artifactDir = Join-Path "${{ runner.temp }}" "hitl-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          foreach ($file in @("nvda.log", "hitl-final.png")) {
            $src = Join-Path $env:TEMP $file
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination (Join-Path $artifactDir $file) -Force
            }
          }

      - name: Upload HITL logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-hitl-logs-${{ inputs.phase }}
          path: ${{ runner.temp }}\hitl-artifacts\*
          if-no-files-found: warn

  build-android:
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.pr_or_branch }}
          path: target-app
          token: ''

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run custom Android hook if provided
        if: ${{ inputs.custom_hook_b64 != '' }}
        working-directory: target-app
        shell: bash
        run: |
          printf '%s' "${{ inputs.custom_hook_b64 }}" | base64 -d > .hitl-hook.sh
          chmod +x .hitl-hook.sh
          ./.hitl-hook.sh

      - name: Build Android debug APK
        working-directory: target-app
        shell: bash
        run: |
          if [ -n "${{ inputs.setup_cmd }}" ]; then
            eval "${{ inputs.setup_cmd }}"
          else
            chmod +x gradlew && ./gradlew assembleDebug
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: a11y-hitl-apk-${{ inputs.phase }}
          path: ${{ inputs.apk_glob }}
          if-no-files-found: error
